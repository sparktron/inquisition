name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . mypy ruff
      - name: Tests
        run: python -m pytest -q
      - name: Type check
        run: python -m mypy .
      - name: Compile
        run: python -m compileall -q .
      - name: Lint
        run: ruff check .
      - name: Wheel install smoke test
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv --system-site-packages /tmp/inquisition-wheel
          /tmp/inquisition-wheel/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/inquisition-wheel/bin/python -c "import config_validation, inquisition, modules.crawler, report.html, scanner"
          /tmp/inquisition-wheel/bin/inquisition --help >/dev/null
