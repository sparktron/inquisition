# Test, then build and publish the container image to GitHub Container Registry.
#
# Pushing a version tag (e.g. v0.1.0) runs the test suite and, if green, builds
# the image and pushes it to ghcr.io/<owner>/inquisition tagged with the version
# and :latest. Can also be run manually (workflow_dispatch) to publish :latest
# from the default branch without pushing.
name: Publish image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . mypy pytest ruff
      - name: Tests
        run: python -m pytest -q
      - name: Type check
        run: python -m mypy .
      - name: Compile
        run: python -m compileall -q .
      - name: Lint
        run: ruff check .
      - name: Wheel install smoke test
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv /tmp/inquisition-wheel
          /tmp/inquisition-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/inquisition-wheel/bin/python -c "import analysis_kb, attack_rules, config_validation, inquisition, modules.crawler, report.html, scanner, sys; from pathlib import Path; prefix = Path(sys.prefix).resolve(); modules = (analysis_kb, attack_rules, config_validation, inquisition, modules.crawler, report.html, scanner); assert all(Path(module.__file__).resolve().is_relative_to(prefix) for module in modules); assert analysis_kb.entries() and attack_rules.load_misconfig_rules() and attack_rules.load_chain_rules()"
          /tmp/inquisition-wheel/bin/inquisition --help >/dev/null

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
